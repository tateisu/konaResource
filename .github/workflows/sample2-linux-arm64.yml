name: sample2 - Linux arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Check ARM cross compiler
        run: clang --version
      - name: Build sample2
        run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2g publishLocalMaven
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx2g :sample2:linkDebugExecutableLinuxArm64
      - name: Upload sample2
        uses: actions/upload-artifact@v4
        with:
          name: sample2-linux-arm64
          path: sample2/build/bin/linuxArm64/debugExecutable/sample2.kexe
      - name: Upload JVM crash log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: sample2-linux-arm64-crash-log
          path: hs_err_pid*.log
          if-no-files-found: ignore

  sample2-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    needs: build-linux-arm64
    steps:
      - name: Download sample2
        uses: actions/download-artifact@v4
        with:
          name: sample2-linux-arm64
          path: sample2/build/bin/linuxArm64/debugExecutable
      - name: Run sample2
        run: |
          chmod +x sample2/build/bin/linuxArm64/debugExecutable/sample2.kexe
          sample2/build/bin/linuxArm64/debugExecutable/sample2.kexe

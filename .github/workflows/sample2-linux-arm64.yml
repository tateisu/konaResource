name: sample2 - Linux arm64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample2-linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run sample2
        run: ./runSample2.sh

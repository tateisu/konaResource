name: BLAKE3 JNI ABI Test - Linux x64 glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-glibc:
    name: Linux x64 glibc
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: common:jvmTest
        run: ./gradlew --no-daemon :common:jvmTest
      - name: BUILD sample2:build
        run: ./gradlew --no-daemon :sample2:build
      - name: BENCHMARK
        run: ./gradlew --no-daemon :benchmark:jvmBenchmark

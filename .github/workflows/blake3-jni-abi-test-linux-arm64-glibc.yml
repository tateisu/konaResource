name: BLAKE3 JNI ABI Test - Linux arm64 glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64-glibc:
    name: Linux arm64 glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: BUILD blake3Jni (native aarch64)
        run: |
          echo "Platform: $(uname -s) $(uname -m)"
          bash blake3Jni/build-native.sh blake3Jni/build/native/libblake3_jni.so "$JAVA_HOME"
          file blake3Jni/build/native/libblake3_jni.so
          ldconfig -p | grep libblake3 || true
          ldd blake3Jni/build/native/libblake3_jni.so || true

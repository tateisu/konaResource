name: BLAKE3 JNI ABI Test - Linux arm64 glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64-glibc:
    name: Linux arm64 glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: BUILD blake3Jni
        run: ./gradlew --no-daemon :blake3Jni:buildBlake3Jni
      - name: common:jvmTest
        run: ./gradlew --no-daemon :common:jvmTest
      - name: BENCHMARK (jvm)
        run: ./gradlew --no-daemon :benchmark:jvmBenchmark

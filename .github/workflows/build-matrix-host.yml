name: build matrix - host

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      runner:
        required: true
        type: string
      test_tasks:
        required: false
        default: ""
        type: string
      benchmark_tasks:
        required: false
        default: ""
        type: string
      sample2_tasks:
        required: true
        type: string
      sample2_targets:
        required: true
        type: string
      empty_tasks:
        required: true
        type: string
      empty_targets:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux cross compilers
        if: inputs.host == 'LinuxX64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Publish local dependencies
        run: ./gradlew --no-daemon --max-workers=1 publishLocalMaven

      - name: Build test, benchmark, sample2, and empty
        env:
          TEST_TASKS: ${{ inputs.test_tasks }}
          BENCHMARK_TASKS: ${{ inputs.benchmark_tasks }}
          SAMPLE2_TASKS: ${{ inputs.sample2_tasks }}
          EMPTY_TASKS: ${{ inputs.empty_tasks }}
        run: |
          tasks=()
          for task in $TEST_TASKS; do tasks+=(":test:$task"); done
          for task in $BENCHMARK_TASKS; do tasks+=(":benchmark:$task"); done
          for task in $SAMPLE2_TASKS; do tasks+=(":sample2:$task"); done
          for task in $EMPTY_TASKS; do tasks+=(":empty:$task"); done
          ./gradlew --no-daemon --max-workers=1 "${tasks[@]}"

      - name: Collect build results
        env:
          HOST: ${{ inputs.host }}
          TEST_TASKS: ${{ inputs.test_tasks }}
          BENCHMARK_TASKS: ${{ inputs.benchmark_tasks }}
          SAMPLE2_TARGETS: ${{ inputs.sample2_targets }}
          EMPTY_TARGETS: ${{ inputs.empty_targets }}
        run: |
          lower_first() {
            local value="$1"
            local first="${value:0:1}"
            first="$(printf '%s' "$first" | tr '[:upper:]' '[:lower:]')"
            printf '%s%s' "$first" "${value:1}"
          }
          copy_executable() {
            local source_dir="$1"
            local executable_name="$2"
            local destination_dir="$3"
            if [[ -f "$source_dir/$executable_name.kexe" ]]; then
              cp "$source_dir/$executable_name.kexe" "$destination_dir/"
            elif [[ -f "$source_dir/$executable_name.exe" ]]; then
              cp "$source_dir/$executable_name.exe" "$destination_dir/"
            else
              printf 'Executable not found: %s/%s.{kexe,exe}\n' "$source_dir" "$executable_name" >&2
              return 1
            fi
          }
          result_dir="workflowResult/$HOST"
          mkdir -p "$result_dir/test" "$result_dir/benchmark" "$result_dir/sample2" "$result_dir/empty"
          for task in $TEST_TASKS; do
            test_target="${task#linkDebugExecutable}"
            test_target="$(lower_first "$test_target")"
            mkdir -p "$result_dir/test/$test_target"
            copy_executable "test/build/bin/$test_target/debugExecutable" konaCommonTest "$result_dir/test/$test_target"
          done
          for task in $BENCHMARK_TASKS; do
            benchmark_target="${task#linkReleaseExecutable}"
            benchmark_target="$(lower_first "$benchmark_target")"
            mkdir -p "$result_dir/benchmark/$benchmark_target"
            copy_executable "benchmark/build/bin/$benchmark_target/releaseExecutable" konaBenchmark "$result_dir/benchmark/$benchmark_target"
          done
          for target in $SAMPLE2_TARGETS; do
            target_dir="$(lower_first "$target")"
            mkdir -p "$result_dir/sample2/$target"
            copy_executable "sample2/build/bin/$target_dir/debugExecutable" sample2 "$result_dir/sample2/$target"
          done
          for target in $EMPTY_TARGETS; do
            target_dir="$(lower_first "$target")"
            mkdir -p "$result_dir/empty/$target"
            copy_executable "empty/build/bin/$target_dir/debugExecutable" empty "$result_dir/empty/$target"
          done

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: build-matrix-${{ inputs.host }}
          path: workflowResult/${{ inputs.host }}
          if-no-files-found: error

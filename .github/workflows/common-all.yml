name: common artifact - all hosts

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux-x64:
    uses: ./.github/workflows/common-linux-x64.yml
    secrets: inherit

  mingw-x64:
    uses: ./.github/workflows/common-mingw-x64.yml
    secrets: inherit

  macos-arm64:
    uses: ./.github/workflows/common-macos-arm64.yml
    secrets: inherit

  collect:
    name: Collect common artifacts
    needs: [linux-x64, mingw-x64, macos-arm64]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux x64 common artifact
        uses: actions/download-artifact@v4
        with:
          name: common-artifact-LinuxX64
          path: workflowResult/LinuxX64

      - name: Download macOS arm64 common artifact
        uses: actions/download-artifact@v4
        with:
          name: common-artifact-MacosArm64
          path: workflowResult/MacosArm64

      - name: Download Mingw X64 common artifact
        uses: actions/download-artifact@v4
        with:
          name: common-artifact-MingwX64
          path: workflowResult/MingwX64

      - name: Merge native common publications
        shell: bash
        run: |
          group_dir="workflowResult/MacosArm64/maven/jp/juggler/konaResource"

          # macOS arm64 can produce every configured Kotlin/Native target.
          cp -R workflowResult/MacosArm64/maven/jp/juggler/konaResource/common "$group_dir/"

          for host in LinuxX64 MacosArm64 MingwX64; do
            for module_dir in \
              workflowResult/$host/maven/jp/juggler/konaResource/common-linux* \
              workflowResult/$host/maven/jp/juggler/konaResource/common-macos* \
              workflowResult/$host/maven/jp/juggler/konaResource/common-mingw*; do
              test -d "$module_dir" || continue
              module_name="${module_dir##*/}"
              test -e "$group_dir/$module_name" || cp -R "$module_dir" "$group_dir/"
            done
          done

          for module_name in common-linuxarm64 common-linuxx64 common-macosarm64 common-mingwx64; do
            test -d "$group_dir/$module_name" || {
              echo "Missing native publication: $module_name" >&2
              exit 1
            }
          done

          root_module="$(find "$group_dir/common" -type f -name '*.module' -print -quit)"
          test -n "$root_module"
          for module_name in common-linuxarm64 common-linuxx64 common-macosarm64 common-mingwx64; do
            jq -e --arg module "$module_name" \
              '[.variants[]?."available-at"?.module] | index($module) != null' \
              "$root_module" >/dev/null || {
              echo "Root metadata does not reference native publication: $module_name" >&2
              exit 1
            }
          done

      - name: Upload collected common artifacts
        uses: actions/upload-artifact@v4
        with:
          name: common-artifacts
          path: workflowResult
          if-no-files-found: error

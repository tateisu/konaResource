name: BLAKE3 JNI ABI Test - Linux arm64 glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64-glibc:
    name: Linux arm64 glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: BUILD blake3Jni
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :blake3Jni:buildBlake3Jni
      - name: common:jvmTest
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :common:jvmTest --info 2>&1 | tee /tmp/test.log || true
      - name: Show test report if failed
        if: failure()
        run: cat /home/runner/work/konaResource/konaResource/common/build/reports/tests/jvmTest/index.html || true
      - name: Show blake3Jni .so info
        run: file blake3Jni/build/native/libblake3_jni.so && ldd blake3Jni/build/native/libblake3_jni.so || true
      - name: BENCHMARK (jvm)
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :benchmark:jvmBenchmark

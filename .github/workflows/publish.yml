name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-common-jars:
    uses: ./.github/workflows/common-jvm-jar-all.yml

  publish:
    needs: build-common-jars
    runs-on: ubuntu-latest
    environment: "maven central"
    env:
      ORG_GRADLE_PROJECT_centralPortalUsername: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
      ORG_GRADLE_PROJECT_centralPortalPassword: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY_01C52FD776E9651B84D63971A8E469517CB52830 }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download host common.jar files
        uses: actions/download-artifact@v4
        with:
          name: common-jars
          path: workflowResult
      - name: Verify collected JNI libraries
        shell: bash
        run: |
          expected_resources=(
            "linux-x86_64/libkona_common_jni.so"
            "linux-aarch64/libkona_common_jni.so"
            "windows-x86_64/kona_common_jni.dll"
            "windows-aarch64/kona_common_jni.dll"
            "macos-universal/libkona_common_jni.dylib"
          )
          for resource in "${expected_resources[@]}"; do
            resource_path="jp/juggler/konaArchive/native/$resource"
            found=false
            for jar_file in workflowResult/*/common.jar; do
              if jar tf "$jar_file" | rg -Fx "$resource_path" >/dev/null; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo "Missing collected JNI resource: $resource_path" >&2
              exit 1
            fi
          done
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon

name: BLAKE3 JNI ABI Test - Linux arm64 glibc

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-arm64-glibc:
    name: Linux arm64 glibc
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: BUILD commonJni
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :commonJni:buildBlake3JniLinuxArm64
      - name: common:jvmTest
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :common:jvmTest --info 2>&1 | tee /tmp/test.log || true
      - name: Show test report if failed
        if: failure()
        run: cat /home/runner/work/konaResource/konaResource/common/build/reports/tests/jvmTest/index.html || true
      - name: Show commonJni .so info
        run: file commonJni/build/native/libblake3_jni.so && ldd commonJni/build/native/libblake3_jni.so || true
      - name: BENCHMARK (jvm)
        env:
          SKIP_NATIVE_TARGETS: "true"
        run: ./gradlew --no-daemon :benchmark:jvmBenchmark

# ネイティブリンクの並列実行で複数ターゲットの LLVM コード生成が同時に走るためヒープを確保する
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
# 複数プロジェクト/独立したタスクを並列実行する
org.gradle.parallel=true
# 同一サブプロジェクト内の独立タスクも並列実行できるようにする
org.gradle.configuration-cache=true
# 共有ソースセット(nativeMain)で cinterop を使用するための commonization を有効化する
kotlin.mpp.enableCInteropCommonization=true

# KSP のインクリメンタル処理を無効化する。
# テストクラス列挙プロセッサは全ソースを走査するため、インクリメンタル時の変更ファイルだけのラウンドで
# 空リストを生成してしまい、テストが一切実行されなくなる不具合を防ぐ。
ksp.incremental=false

# ビルドホスト上で動作しないターゲットのテストに関する警告を抑止する
kotlin.native.ignoreDisabledTargets=true

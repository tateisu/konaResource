name: build matrix - host

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      runner:
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux cross compilers
        if: inputs.host == 'LinuxX64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64

      - name: Publish local dependencies
        run: ./gradlew --no-daemon --max-workers=1 publishLocalMaven

      - name: Build all
        run: ./gradlew --no-daemon --max-workers=1 build

      - name: Collect build results
        env:
          HOST: ${{ inputs.host }}
        run: |
          copy_executables() {
            local module="$1"
            local configuration="$2"
            local executable_name="$3"
            local category="$4"
            local count=0
            local binary
            shopt -s nullglob
            for binary in \
              "$module/build/bin"/*/"$configuration"/"$executable_name.kexe" \
              "$module/build/bin"/*/"$configuration"/"$executable_name.exe"; do
              local target_dir
              target_dir="$(basename "$(dirname "$(dirname "$binary")")")"
              mkdir -p "$result_dir/$category/$target_dir"
              cp "$binary" "$result_dir/$category/$target_dir/"
              count=$((count + 1))
            done
            shopt -u nullglob
            if [[ "$count" -eq 0 ]]; then
              printf 'No executable found: %s/%s/%s.{kexe,exe}\n' "$module" "$configuration" "$executable_name" >&2
              return 1
            fi
          }
          result_dir="workflowResult/$HOST"
          mkdir -p "$result_dir/test" "$result_dir/benchmark" "$result_dir/sample2" "$result_dir/empty"
          copy_executables test debugExecutable konaCommonTest test
          copy_executables benchmark releaseExecutable konaBenchmark benchmark
          copy_executables sample2 debugExecutable sample2 sample2
          copy_executables empty debugExecutable empty empty

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: build-matrix-${{ inputs.host }}
          path: workflowResult/${{ inputs.host }}
          if-no-files-found: error

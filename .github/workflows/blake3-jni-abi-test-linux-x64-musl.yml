name: BLAKE3 JNI ABI Test - Linux x64 musl

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-musl:
    name: Linux x64 musl
    runs-on: ubuntu-latest
    container:
      image: alpine:3.22
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install dependencies
        run: apk add --no-cache openjdk21 bash
      - name: Set JAVA_HOME
        run: export JAVA_HOME=/usr/lib/jvm/java-21-openjdk/x64
      - name: common:jvmTest
        run: ./gradlew --no-daemon :common:jvmTest
      - name: BUILD sample2:build
        run: ./gradlew --no-daemon :sample2:build
      - name: BENCHMARK
        run: ./gradlew --no-daemon :benchmark:jvmBenchmark

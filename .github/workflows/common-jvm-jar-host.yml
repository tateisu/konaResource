name: common-jvm jar - host build

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      runner:
        required: true
        type: string
      expected_targets:
        required: true
        type: string
      expected_resources:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Linux cross compilers
        if: inputs.host == 'LinuxX64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 unzip

      - name: Download Linux arm64 JDK headers
        if: inputs.host == 'LinuxX64'
        run: |
          mkdir -p jdk/LinuxArm64
          mkdir -p /tmp/microsoft-jdk-linux-aarch64
          curl --fail --location --silent --show-error \
            https://aka.ms/download-jdk/microsoft-jdk-21.0.12.1-linux-aarch64.tar.gz \
            --output /tmp/microsoft-jdk-linux-aarch64.tar.gz
          tar --extract --gzip --file /tmp/microsoft-jdk-linux-aarch64.tar.gz \
            --directory /tmp/microsoft-jdk-linux-aarch64
          cp -R /tmp/microsoft-jdk-linux-aarch64/jdk-*/include jdk/LinuxArm64/

      - name: Download Windows x64 JDK headers
        if: inputs.host == 'LinuxX64'
        run: |
          mkdir -p jdk/WindowsX64
          curl --fail --location --silent --show-error \
            https://aka.ms/download-jdk/microsoft-jdk-21.0.12.1-windows-x64.zip \
            --output /tmp/microsoft-jdk-windows-x64.zip
          unzip -q /tmp/microsoft-jdk-windows-x64.zip -d /tmp/microsoft-jdk-windows-x64
          cp -R /tmp/microsoft-jdk-windows-x64/*/include jdk/WindowsX64/

      - name: Download macOS arm64 JDK headers
        if: inputs.host == 'MacosX64'
        run: |
          mkdir -p jdk/MacosArm64
          mkdir -p /tmp/microsoft-jdk-macos-aarch64
          curl --fail --location --silent --show-error \
            https://aka.ms/download-jdk/microsoft-jdk-21.0.12.1-macos-aarch64.tar.gz \
            --output /tmp/microsoft-jdk-macos-aarch64.tar.gz
          gtar --extract --gzip --file /tmp/microsoft-jdk-macos-aarch64.tar.gz \
            --directory /tmp/microsoft-jdk-macos-aarch64
          cp -R /tmp/microsoft-jdk-macos-aarch64/jdk-*/include jdk/MacosArm64/

      - name: Download macOS x64 JDK headers
        if: inputs.host == 'MacosArm64'
        run: |
          mkdir -p jdk/MacosX64
          mkdir -p /tmp/microsoft-jdk-macos-x64
          curl --fail --location --silent --show-error \
            https://aka.ms/download-jdk/microsoft-jdk-21.0.12.1-macos-x64.tar.gz \
            --output /tmp/microsoft-jdk-macos-x64.tar.gz
          gtar --extract --gzip --file /tmp/microsoft-jdk-macos-x64.tar.gz \
            --directory /tmp/microsoft-jdk-macos-x64
          cp -R /tmp/microsoft-jdk-macos-x64/jdk-*/include jdk/MacosX64/

      - name: Build common-jvm jar
        run: ./gradlew --no-daemon --max-workers=1 :common:jvmJar

      - name: Verify expected JNI targets
        continue-on-error: true
        env:
          EXPECTED_TARGETS: ${{ inputs.expected_targets }}
          EXPECTED_RESOURCES: ${{ inputs.expected_resources }}
        run: |
          common_jar=""
          for candidate in common/build/libs/common-jvm-*.jar; do
            case "$candidate" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            if [[ -z "$common_jar" || "$candidate" -nt "$common_jar" ]]; then
              common_jar="$candidate"
            fi
          done
          test -n "$common_jar"
          echo "Expected JniBuildTarget: $EXPECTED_TARGETS"
          jar_contents="$(jar tf "$common_jar")"
          for resource in $EXPECTED_RESOURCES; do
            case "$resource" in
              macos-universal)
                resource_path="jp/juggler/konaArchive/native/macos-universal/"
                ;;
              *)
                resource_path="jp/juggler/konaArchive/native/$resource/"
                ;;
            esac
            found=false
            while IFS= read -r entry; do
              if [[ "$entry" == "$resource_path"* ]]; then
                found=true
                break
              fi
            done <<< "$jar_contents"
            if [[ "$found" != true ]]; then
              echo "Missing JNI resource: $resource_path" >&2
              exit 1
            fi
          done

      - name: Copy common.jar
        run: |
          mkdir -p workflowResult/${{ inputs.host }}
          common_jar=""
          for candidate in common/build/libs/common-jvm-*.jar; do
            case "$candidate" in
              *-sources.jar|*-javadoc.jar) continue ;;
            esac
            if [[ -z "$common_jar" || "$candidate" -nt "$common_jar" ]]; then
              common_jar="$candidate"
            fi
          done
          test -n "$common_jar"
          cp "$common_jar" workflowResult/${{ inputs.host }}/common.jar

      - name: Upload common.jar
        uses: actions/upload-artifact@v4
        with:
          name: common-jar-${{ inputs.host }}
          path: workflowResult/${{ inputs.host }}/common.jar
          if-no-files-found: error

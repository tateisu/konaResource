name: sample2 - Windows x64

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  sample2-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Run sample2
        run: ./runSample2.sh

name: build matrix - host

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      runner:
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: publishLocalMaven
        run: ./gradlew --no-daemon --max-workers=1 publishLocalMaven

      - name: Build all
        id: build
        continue-on-error: true
        run: ./gradlew --no-daemon --max-workers=1 build --continue -x :sample1:build

      - name: Collect build results
        if: always()
        env:
          HOST: ${{ inputs.host }}
        run: |
          copy_executables() {
            local module="$1"
            local configuration="$2"
            local executable_name="$3"
            local category="$4"
            local count=0
            local binary
            shopt -s nullglob
            for binary in \
              "$module/build/bin"/*/"$configuration"/"$executable_name.kexe" \
              "$module/build/bin"/*/"$configuration"/"$executable_name.exe"; do
              local target_dir
              target_dir="$(basename "$(dirname "$(dirname "$binary")")")"
              mkdir -p "$result_dir/$category/$target_dir"
              cp "$binary" "$result_dir/$category/$target_dir/"
              count=$((count + 1))
            done
            shopt -u nullglob
            if [[ "$count" -eq 0 ]]; then
              printf 'No executable found: %s/%s/%s.{kexe,exe}\n' "$module" "$configuration" "$executable_name" >&2
            fi
          }
          result_dir="nativeBinaries/$HOST"
          mkdir -p "$result_dir/test" "$result_dir/benchmark" "$result_dir/sample2" "$result_dir/empty"
          copy_executables empty debugExecutable empty empty
          copy_executables sample2 debugExecutable sample2 sample2
          copy_executables test debugExecutable konaCommonTest test
          copy_executables benchmark releaseExecutable konaBenchmark benchmark

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nativeBinaries-${{ inputs.host }}
          path: nativeBinaries/${{ inputs.host }}
          if-no-files-found: warn

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

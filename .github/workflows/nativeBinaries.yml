name: build matrix - host

on:
  workflow_call:
    inputs:
      host:
        required: true
        type: string
      runner:
        required: true
        type: string
permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download Kotlin/Native distribution and dependencies
        run: ./gradlew --no-daemon --max-workers=1 :common:downloadKotlinNativeDistribution -PbootstrapKotlinNative

      - name: publishLocalMaven
        run: ./gradlew --no-daemon --max-workers=1 publishLocalMaven

      - name: Build all
        id: build
        continue-on-error: true
        run: ./gradlew --no-daemon --max-workers=1 build --continue -x :sample1:build

      - name: Collect build results
        if: always()
        env:
          HOST: ${{ inputs.host }}
        run: |
          result_dir="nativeBinaries/$HOST"
          mkdir -p "$result_dir"
          count=0
          while IFS= read -r -d '' binary; do
            module="${binary%%/build/bin/*}"
            relative="${binary#"$module/build/bin/"}"
            mkdir -p "$result_dir/$module/$(dirname "$relative")"
            cp "$binary" "$result_dir/$module/$relative"
            count=$((count + 1))
          done < <(find */build -type f -path '*/bin/*' -print0)
          if [[ "$count" -eq 0 ]]; then
            printf 'No files found below */build/bin\n' >&2
            exit 1
          fi
          printf 'Collected %s files below */build/bin\n' "$count"

      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nativeBinaries-${{ inputs.host }}
          path: nativeBinaries/${{ inputs.host }}
          if-no-files-found: warn

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

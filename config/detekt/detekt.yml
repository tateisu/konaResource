# Project-wide Detekt configuration.
# Default Detekt rules remain enabled through buildUponDefaultConfig.
config:
  validation: true
  warningsAsErrors: false

exceptions:
  TooGenericExceptionCaught:
    active: false

performance:
  SpreadOperator:
    active: false

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false

complexity:
  NestedBlockDepth:
    threshold: 8
  LongParameterList:
    functionThreshold: 10
    constructorThreshold: 20

formatting:
  active: true
  autoCorrect: false
  Filename:
    active: false
  Indentation:
    active: false
